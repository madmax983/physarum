[package]
name = "physarum-app"
description = "Physarum: a slime mold whose agents and trail live in a SQLite fleet split between hosts — kill one and the veins route around the holes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "physarum-app"

[dependencies]
mold = { path = "../mold" }
anyhow = { workspace = true }
autumn-web = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
maud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
autumn-web = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
